name: Curriculum CI (Scripts, Python & CMake)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-shell-and-python:
    name: Shell & Python Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          shopt -s globstar nullglob
          scripts=(scripts/*.sh phase1_setup/*.sh **/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found yet."
            exit 0
          fi
          for f in "${scripts[@]}"; do
            echo "Checking $f"
            bash -n "$f"
            shellcheck -x "$f"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile-check Python files
        run: |
          python3 -m compileall -q .

  build-cmake-targets:
    name: CMake C++ Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build CMake project (host stub mode)
        run: |
          if [ ! -f "phase2_gpio_media/cpp_cmake/CMakeLists.txt" ]; then
            echo "CMakeLists.txt not added yet; skipping build."
            exit 0
          fi
          cmake -S phase2_gpio_media/cpp_cmake \
                -B build/phase2 \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_STUB_HARDWARE=ON
          cmake --build build/phase2 -j"$(nproc)"
