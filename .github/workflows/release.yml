name: Phase Release & Badge Sync

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  publish-release:
    name: Create Release & Update status.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update VERSION and status.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          TODAY="$(date -u +%Y-%m-%d)"
          echo "$VER" > VERSION
          cat <<EOF > status.json
          {
            "schemaVersion": 1,
            "label": "release",
            "message": "${TAG} (${TODAY})",
            "color": "2ea44f"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION status.json
          git diff --staged --quiet || git commit -m "chore(release): sync status badge for ${TAG}"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
